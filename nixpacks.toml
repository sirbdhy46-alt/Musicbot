providers = ["node"]

[phases.setup]
nixPkgs = ["...", "ffmpeg", "python3", "curl"]

[phases.install]
cmds = ["npm install -g pnpm@9", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "mkdir -p artifacts/aether-bot/bin",
  "curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o artifacts/aether-bot/bin/yt-dlp",
  "chmod +x artifacts/aether-bot/bin/yt-dlp"
]

[start]
cmd = "pnpm --filter @workspace/aether-bot start"
